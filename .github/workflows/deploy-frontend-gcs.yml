# Deploy the frontend to a GCS bucket (Phase 3 target — replaces GitHub Pages).
#
# DORMANT until the infra runbook (docs/PHASE3_INFRA_SETUP.md) is done and the
# GCP_* secrets + per-env VITE_* variables exist. workflow_dispatch ONLY for
# now so it never auto-runs before the buckets exist. The existing GitHub Pages
# deploy (deploy.yml) keeps serving the pilot until Phase 3 cuts over.
# Once secrets/buckets exist, wire ITG to auto-deploy on push to main.

name: Deploy frontend (GCS)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [itg, prod]
        default: itg

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build with env-specific config
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync dist/ to gs://mtb-web-${{ inputs.environment }}
        run: |
          gcloud storage rsync dist gs://mtb-web-${{ inputs.environment }} \
            --recursive --delete-unmatched-destination-objects
